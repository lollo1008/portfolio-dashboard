name: Aggiornamento Automatico Dati Portafoglio

# Esegue lo script di download/analisi a orari fissi, senza bisogno che
# il tuo computer sia acceso. Aggiorna i CSV nel repository, che Power BI
# puo' leggere direttamente da GitHub (vedi README_AUTOMAZIONE.md).

on:
  schedule:
    # Ogni lunedi alle 07:00 UTC (le 08:00/09:00 in Italia a seconda dell'ora legale)
    # Sintassi cron: minuto ora giorno-mese mese giorno-settimana
    - cron: "0 7 * * 1"
  workflow_dispatch:
    # Permette anche di lanciarlo manualmente da GitHub (tab "Actions" -> "Run workflow")

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario per fare il commit dei dati aggiornati

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install yfinance pandas openpyxl

      - name: Esegui la pipeline (download + analytics + export)
        run: python run_full_pipeline.py
        working-directory: ./data

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.json data/*.db data/powerbi/*.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento automatico dati portafoglio $(date +'%Y-%m-%d')"
          git push
